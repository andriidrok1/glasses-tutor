name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project GlassesTutor.xcodeproj -scheme GlassesTutor

      # Developer Mode build: MetaAppID / ClientToken empty, SDK skips attestation.
      - name: Build devmode
        run: scripts/build-ipa.sh devmode

      # Registered build: IDs from the Wearables Developer Center project (repo secrets).
      - name: Build registered
        if: ${{ env.META_APP_ID != '' }}
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/build-ipa.sh registered \
            "META_APP_ID=$META_APP_ID" \
            "CLIENT_TOKEN=$CLIENT_TOKEN" \
            "APPLE_TEAM_ID=$APPLE_TEAM_ID"

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: GlassesTutor-ipa
          path: GlassesTutor-*.ipa

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "latest unsigned IPA" --notes "Rolling build from main. Sign with a free Apple ID via Impactor." --prerelease
          gh release upload latest GlassesTutor-*.ipa --clobber

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
